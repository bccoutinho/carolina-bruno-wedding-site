<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>RSVP Control — Carolina &amp; Bruno</title>
  <style>
    :root{--ivory:#efe7d6;--ink:#2b3324;--soft:#4e5a43;--grey:#6f6a59;--rasp:#bc3a58;
      --line:#e2d7bf;--green:#3f5a32;--red:#9a3b3b;
      --serif:Georgia,"Times New Roman",serif;--sans:"Helvetica Neue",Arial,sans-serif;}
    *{box-sizing:border-box}
    body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans);line-height:1.5;padding:28px 18px 60px}
    .wrap{max-width:860px;margin:0 auto}
    h1{font-family:var(--serif);font-weight:500;font-size:28px;margin:0 0 4px}
    .muted{color:var(--grey);font-size:13px}
    .bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:18px 0 24px;
      padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:8px}
    .pill{font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:999px}
    .pill.open{background:#e9f0e3;color:var(--green)}
    .pill.closed{background:#f6e7e7;color:var(--red)}
    button{font-family:var(--sans);font-size:13px;letter-spacing:.04em;border-radius:6px;padding:9px 16px;
      cursor:pointer;border:1px solid var(--rasp);background:var(--rasp);color:#fff}
    button.ghost{background:none;color:var(--rasp)}
    button:disabled{opacity:.45;cursor:default}
    .spacer{flex:1}
    .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
    .tile{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px}
    .tile .n{font-family:var(--serif);font-size:30px;line-height:1}
    .tile .l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);margin-top:6px}
    .tile.big .n{color:var(--green)}
    h2{font-family:var(--serif);font-weight:500;font-size:19px;margin:26px 0 10px;
      border-bottom:1px solid var(--line);padding-bottom:6px}
    h2 .c{color:var(--grey);font-size:14px;font-family:var(--sans)}
    .fam{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 15px;margin-bottom:9px}
    .fam .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
    .fam .name{font-family:var(--serif);font-size:17px}
    .fam .room{font-size:12px;color:var(--grey)}
    .fam ul{margin:8px 0 0;padding-left:18px}
    .fam li{font-size:14px;color:var(--soft);margin:2px 0}
    .fam li .g{color:var(--grey);font-size:12.5px}
    .fam .msg{margin-top:7px;color:var(--rasp);font-style:italic;font-size:14px}
    .chips{display:flex;flex-wrap:wrap;gap:7px}
    .chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
    .chip .p{color:var(--grey)}
    .gate{max-width:360px;margin:60px auto;text-align:center}
    .gate input{width:100%;padding:11px;border:1px solid var(--line);border-radius:6px;font-size:15px;margin:10px 0}
    .err{color:var(--red);font-size:13px}
    .dim{color:var(--grey)}
  </style>
</head>
<body>
  <div class="wrap" id="app"><p class="muted">Loading…</p></div>

  <script>
    const LOCAL = new URLSearchParams(location.search).get("backend") === "local";   // default: the real backend
    const EXEC = "https://script.google.com/macros/s/AKfycbxSCJj0KO2Y97PqmmN4tTd7hBpO4053NNCC_Q3_Erls7Rtk_l0N6fGNQeYHSPYGYwm3/exec";
    const KEY = new URLSearchParams(location.search).get("admin") || "";
    function jsonp(params){
      return new Promise((resolve,reject)=>{
        if(!EXEC) return reject(new Error("no exec"));
        const cb="cb_"+Math.random().toString(36).slice(2);
        const s=document.createElement("script");
        const done=(fn,a)=>{clearTimeout(t);delete window[cb];s.remove();fn(a);};
        const t=setTimeout(()=>done(reject,new Error("timeout")),8000);
        window[cb]=d=>done(resolve,d);
        s.onerror=()=>done(reject,new Error("jsonp"));
        s.src=EXEC+"?"+new URLSearchParams(Object.assign({},params,{callback:cb})).toString();
        document.body.appendChild(s);
      });
    }
    function computeDashboard(roster, replies, open){
      const by={}; (replies||[]).forEach(r=>{by[r.token]=r;});
      const jp=v=>{try{return JSON.parse(v||"[]")}catch(e){return[]}};
      const coming=[],declined=[],pending=[]; let confirmed=0;
      roster.slice().sort((a,b)=>(a.name||"").toLowerCase().localeCompare((b.name||"").toLowerCase())).forEach(f=>{
        const r=by[f.token];
        if(!r){ pending.push({name:f.name,party:f.party}); return; }
        if((r.attending||"")==="yes"){
          const ppl=jp(r.attendees_json), gm={}; jp(r.game_json).forEach(g=>gm[g.name]=g);
          const people=ppl.map(p=>({name:p.name,arrival:p.arrival,coming:p.coming,child:!!p.child,
            hometown:(gm[p.name]||{}).hometown||"", place:(gm[p.name]||{}).game_place||"", photo:!!(gm[p.name]||{}).photo_url}));
          const c=ppl.filter(p=>p.coming).length; confirmed+=c;
          const k=ppl.filter(p=>p.coming&&p.child).length;
          coming.push({name:f.name,count:c,kids:k,room:r.accommodation||"",message:r.message||"",people});
        } else declined.push(f.name);
      });
      return {open:open!==false,total:roster.length,replied:coming.length+declined.length,
        guests_confirmed:confirmed,awaited:pending.reduce((a,p)=>a+(+p.party||0),0),coming,declined,pending};
    }
    function errBox(m){ document.getElementById("app").innerHTML=`<div class="gate"><h1>RSVP Control</h1><p class="err">${m}</p></div>`; }

    // raw reply records (for CSV download) + CSV builder
    let RAW = [];
    const CSV_FIELDS = ["submitted_at","id","token","household","attending","attendee_count",
      "attendees","attendees_json","accommodation","game","game_json","message"];
    function csvCell(v){ v=String(v==null?"":v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
    function downloadCSV(){
      const rows=[CSV_FIELDS.join(",")].concat(RAW.map(r=>CSV_FIELDS.map(f=>csvCell(r[f])).join(",")));
      const blob=new Blob([rows.join("\n")],{type:"text/csv;charset=utf-8"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
      a.download="rsvps.csv"; document.body.appendChild(a); a.click(); a.remove();
    }
    window.downloadCSV = downloadCSV;
    const ROOM = {both:"both nights",night19:"the 19th only",none:"all sorted","":"—"};
    const el = (h) => { const d=document.createElement("div"); d.innerHTML=h; return d.firstElementChild; };
    const esc = (s)=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

    function gate(msg){
      document.getElementById("app").innerHTML =
        `<div class="gate"><h1>RSVP Control</h1>
         ${msg?`<p class="err">${msg}</p>`:""}
         <p class="muted">Enter the admin key</p>
         <input id="k" type="password" placeholder="admin key" autofocus>
         <button onclick="go()">Open control</button></div>`;
    }
    window.go = () => { const k=document.getElementById("k").value.trim();
      if(k) location.search = "?admin="+encodeURIComponent(k); };

    async function toggle(open){
      try{
        if(LOCAL) await fetch(`/control?admin=${encodeURIComponent(KEY)}&open=${open?1:0}`,{cache:"no-store"});
        else await jsonp({admin:KEY, open:open?1:0});
      }catch(e){}
      load();
    }
    window.toggle = toggle;

    async function resetAll(){
      if(!confirm("Delete ALL saved RSVP replies? This is for testing and cannot be undone.")) return;
      try{
        if(LOCAL) await fetch(`/control?admin=${encodeURIComponent(KEY)}&reset=all`,{cache:"no-store"});
        else await jsonp({admin:KEY, reset:"all"});
      }catch(e){}
      // also clear this browser's remembered "already replied" flags (same origin as the guest site)
      try{ Object.keys(localStorage).filter(k=>k.startsWith("cb-")).forEach(k=>localStorage.removeItem(k)); }catch(e){}
      load();
    }
    window.resetAll = resetAll;

    function render(d){
      const app = document.getElementById("app");
      const coming = d.coming.map(f=>`
        <div class="fam"><div class="hd">
          <span class="name">${esc(f.name)} <span class="dim">· ${f.count} coming${f.kids?` · ${f.kids} 👶`:""}</span></span>
          <span class="room">room: ${ROOM[f.room]||esc(f.room)||"—"}</span></div>
          <ul>${f.people.map(p=>p.coming
            ? `<li>${esc(p.name)}${p.child?" 👶":""} <span class="g">— ${esc(p.arrival)}${(p.hometown||p.place)?` · from ${esc(p.hometown)||"—"}, wants ${esc(p.place)||"—"}${p.photo?" 📷":""}`:""}</span></li>`
            : `<li class="dim">${esc(p.name)} — not coming</li>`).join("")}</ul>
          ${f.message?`<div class="msg">“${esc(f.message)}”</div>`:""}
        </div>`).join("") || `<p class="dim">None yet.</p>`;

      app.innerHTML = `
        <h1>RSVP Control</h1>
        <p class="muted">Carolina &amp; Bruno · 19 June 2027</p>
        <div class="bar">
          <span class="pill ${d.open?"open":"closed"}">${d.open?"Site open":"Site closed"}</span>
          <span class="spacer"></span>
          ${d.open
            ? `<button onclick="toggle(false)">Close RSVPs</button>`
            : `<button onclick="toggle(true)">Reopen RSVPs</button>`}
          <button class="ghost" onclick="downloadCSV()">⬇ CSV</button>
          <button class="ghost" onclick="load()">Refresh</button>
          <button class="ghost" onclick="resetAll()" style="border-color:var(--red);color:var(--red)">↺ Reset all (test)</button>
        </div>
        <div class="tiles">
          <div class="tile big"><div class="n">${d.guests_confirmed}</div><div class="l">Guests confirmed</div></div>
          <div class="tile"><div class="n">${d.replied}/${d.total}</div><div class="l">Families replied</div></div>
          <div class="tile"><div class="n">${d.pending.length}</div><div class="l">Not replied</div></div>
          <div class="tile"><div class="n">${d.declined.length}</div><div class="l">Declined</div></div>
        </div>

        <h2>Coming <span class="c">· ${d.coming.length} families, ${d.guests_confirmed} guests</span></h2>
        ${coming}

        <h2>Not replied yet <span class="c">· ${d.pending.length} · ~${d.awaited} seats</span></h2>
        <div class="chips">${d.pending.map(p=>`<span class="chip">${esc(p.name)} <span class="p">(${esc(p.party)})</span></span>`).join("") || '<span class="dim">Everyone replied 🎉</span>'}</div>

        <h2>Declined <span class="c">· ${d.declined.length}</span></h2>
        <div class="chips">${d.declined.map(n=>`<span class="chip">${esc(n)}</span>`).join("") || '<span class="dim">None.</span>'}</div>
      `;
    }

    async function load(){
      if(!KEY) return gate();
      try{
        let d;
        if(LOCAL){
          const res = await fetch(`/admin-data?admin=${encodeURIComponent(KEY)}`,{cache:"no-store"});
          if(res.status===403) return gate("Wrong key.");
          d = await res.json();
          RAW = d.replies || [];
        } else {
          if(!EXEC) return errBox("Backend not connected yet — deploy Apps Script and set EXEC.");
          const resp = await jsonp({admin:KEY, all:1});
          if(!resp || resp.replies===undefined) return gate("Wrong key.");
          RAW = resp.replies || [];
          d = computeDashboard(resp.roster || [], resp.replies, resp.open);   // roster = live invitations in the sheet
        }
        render(d);
      }catch(e){ errBox(LOCAL ? "Can't reach the server. Is serve_local.py running?" : "Can't reach the backend."); }
    }
    load();
  </script>
</body>
</html>
